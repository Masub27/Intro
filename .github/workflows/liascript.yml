name: LiaScript to SCORM Automation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install LiaScript CLI
      run: npm install -g liascript

    - name: Build SCORM Package
      run: liaex -i README.md --format scorm1.2 --output scorm-package

    - name: Upload SCORM as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: scorm-package
        path: scorm-package
